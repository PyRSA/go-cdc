# Doris FE + BE for the real-Doris integration suite.
#
# Linux only: host networking is required so the FE can redirect Stream Load to
# a BE address that the test process (running on the host) can reach. A bridge
# network would advertise a container-only 172.x address and redirects would
# time out.
#
# The runner must allow vm.max_map_count >= 2000000; scripts/doris-up.sh checks
# the value and CI sets it before starting the containers.
services:
  fe:
    image: apache/doris:fe-${DORIS_VERSION:-2.1.8}
    hostname: fe
    network_mode: host
    environment:
      - FE_SERVERS=fe1:127.0.0.1:9010
      - FE_ID=1
    volumes:
      - ./workdir/doris/fe/doris-meta:/opt/apache-doris/fe/doris-meta
      - ./workdir/doris/fe/log:/opt/apache-doris/fe/log
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  be:
    image: apache/doris:be-${DORIS_VERSION:-2.1.8}
    hostname: be
    network_mode: host
    depends_on:
      - fe
    environment:
      - FE_SERVERS=fe1:127.0.0.1:9010
      - BE_ADDR=127.0.0.1:9050
    volumes:
      - ./workdir/doris/be/storage:/opt/apache-doris/be/storage
      - ./workdir/doris/be/log:/opt/apache-doris/be/log
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
