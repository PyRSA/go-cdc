# MySQL (+ optional Kafka) for go-cdc integration tests.
# One MySQL instance hosts source + sink databases (suite-scoped).
# Override image for version matrix, e.g.:
#   MYSQL_IMAGE=mysql:5.7.42 MYSQL_TAG=57 bash scripts/mysql-up.sh
# Kafka: bash scripts/kafka-up.sh (same COMPOSE_PROJECT_NAME as mysql-up).
# Elasticsearch 8 (security off, single node): bash scripts/es-up.sh
# Elasticsearch 7.17 (security off, single node): bash scripts/es7-up.sh
services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.36}
    # No fixed container_name: COMPOSE_PROJECT_NAME isolates e2e vs scale (and version tags).
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      TZ: Asia/Shanghai
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=67108864
    volumes:
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  # KRaft single-node broker for Kafka sink IT (host → 127.0.0.1:${KAFKA_HOST_PORT}).
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.8.1}
    ports:
      - "${KAFKA_HOST_PORT:-19092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:${KAFKA_HOST_PORT:-19092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Allow mega-field IT payloads (2MiB LONGBLOB → JSON/base64 ≈ 3MiB+).
      # socket.request.max.bytes stays at Kafka's 100MiB default (must exceed message.max).
      KAFKA_MESSAGE_MAX_BYTES: "10485760"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "10485760"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # Single-node ES8 for the Elasticsearch sink suites (host → 127.0.0.1:${ES_HOST_PORT}).
  # Security is disabled on purpose: the harness talks plain HTTP to a throwaway node.
  # Heap stays small so it fits next to MySQL in CI; the suites are correctness-first.
  elasticsearch:
    image: ${ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.15.3}
    ports:
      - "${ES_HOST_PORT:-19200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms${ES_HEAP:-512m} -Xmx${ES_HEAP:-512m}"
      # Bulk/scroll plus a small disk image: never trip the watermark checks.
      cluster.routing.allocation.disk.threshold_enabled: "false"
      action.destructive_requires_name: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null",
        ]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  # Single-node ES7 for the v7 client adapter suite (host → 127.0.0.1:${ES7_HOST_PORT}).
  # Kept separate from the ES8 node so both sinks can be verified on one machine.
  elasticsearch7:
    image: ${ES7_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:7.17.24}
    # Gated behind the es7 profile: mysql-up.sh runs a full `docker compose up`,
    # which must not start this node (port 19201, extra heap) for unrelated jobs.
    profiles: ["es7"]
    ports:
      - "${ES7_HOST_PORT:-19201}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms${ES7_HEAP:-512m} -Xmx${ES7_HEAP:-512m}"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      action.destructive_requires_name: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null",
        ]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
