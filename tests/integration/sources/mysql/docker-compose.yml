# MySQL source (binlog) for every CDC suite.
#
# One instance hosts the source and sink databases; suites are isolated by
# database name. It is started for every sink, which is why it lives under
# sources/ instead of a sink directory:
#
#     bash scripts/setup.sh mysql            # this file only
#     bash scripts/setup.sh postgresql pg14  # this file + sinks/postgresql/
#
# The compose project name (COMPOSE_PROJECT_NAME) isolates concurrent runs and
# version tags, so no container_name is pinned here.
services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.36}
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      TZ: Asia/Shanghai
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=67108864
    volumes:
      # Relative to THIS file, so the paths stay inside sources/mysql/.
      - ./conf.d:/etc/mysql/conf.d:ro
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
