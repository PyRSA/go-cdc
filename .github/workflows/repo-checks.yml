# Repo hygiene checks (file size + MIT license declarations).
name: CI / Repo Checks

on:
  pull_request:
  push:

# Per-workflow group (both this and integration.yml display as "CI").
# Newer commit on same branch/PR cancels older repo-checks only.
concurrency:
  group: repo-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Skip push when an open same-repo PR already covers this branch head.
  decide:
    name: Decide run
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.decide.outputs.run }}
    permissions:
      pull-requests: read
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "push" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "event=${EVENT_NAME}: run"
            exit 0
          fi
          # Fail open on API errors so push CI still runs without PR coverage.
          count="$(gh api \
            "repos/${REPO}/pulls?state=open&head=${OWNER}:${REF_NAME}" \
            --jq 'length' 2>/dev/null || true)"
          if [[ "${count}" =~ ^[0-9]+$ && "${count}" -gt 0 ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "push skipped: ${count} open PR(s) for ${OWNER}:${REF_NAME}"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            if [[ -z "${count}" || ! "${count}" =~ ^[0-9]+$ ]]; then
              echo "push runs: PR lookup failed or empty; fail-open"
            else
              echo "push runs: no open PR for ${OWNER}:${REF_NAME}"
            fi
          fi

  check-file-size:
    name: File size
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed file sizes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          MAX_BYTES: "1048576"
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${PR_BASE}"
            HEAD_SHA="${PR_HEAD}"
            RANGE="${BASE_SHA}...${HEAD_SHA}"
          else
            BASE_SHA="${PUSH_BEFORE}"
            HEAD_SHA="${PUSH_AFTER:-${GITHUB_SHA}}"
            # New branch / force-push with no parent: fall back to commit tree.
            if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
              RANGE="${HEAD_SHA}"
              echo "No usable before SHA; checking all files in ${HEAD_SHA}."
              failed=0
              while IFS= read -r -d '' file; do
                [[ -z "${file}" ]] && continue
                if [[ ! -f "${file}" ]] || [[ -L "${file}" ]]; then
                  continue
                fi
                size="$(wc -c < "${file}")"
                if (( size > MAX_BYTES )); then
                  echo "Error: ${file} is larger than 1 MiB (${size} bytes)."
                  failed=1
                fi
              done < <(git ls-tree -z -r --name-only "${HEAD_SHA}")
              if (( failed )); then
                exit 1
              fi
              echo "OK: no file in ${HEAD_SHA} exceeds ${MAX_BYTES} bytes."
              exit 0
            fi
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          fi
          echo "Checking file sizes in range ${RANGE}"
          failed=0
          while IFS= read -r -d '' file; do
            [[ -z "${file}" ]] && continue
            if [[ ! -f "${file}" ]] || [[ -L "${file}" ]]; then
              continue
            fi
            size="$(wc -c < "${file}")"
            if (( size > MAX_BYTES )); then
              echo "Error: ${file} is larger than 1 MiB (${size} bytes)."
              failed=1
            fi
          done < <(git diff --no-renames --name-only -z ${RANGE})
          if (( failed )); then
            exit 1
          fi
          echo "OK: no changed file exceeds ${MAX_BYTES} bytes."

  check-license-decls:
    name: License
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan tracked files
        run: python3 test/check-license-decls.py
