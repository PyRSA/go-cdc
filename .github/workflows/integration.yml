name: CI / Integration

on:
  # Heavy IT only when CDC source / module / IT harness (or this workflow) changes.
  # Any *.md and demo configs/** are excluded.
  push:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".golangci.yml"
      - "test/integration/**"
      - ".github/workflows/integration.yml"
      - "!**/*.md"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".golangci.yml"
      - "test/integration/**"
      - ".github/workflows/integration.yml"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      scale_profile:
        description: "Scale profile"
        type: choice
        options: [normal, heavy]
        default: heavy

# Per-workflow group: a newer commit on the same branch/PR cancels older runs
# of THIS workflow only. Same commit's repo-checks / release runs are untouched.
concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Same-repo PR + push would double-run; skip push work when an open PR
  # already covers this head (pull_request / workflow_dispatch always run).
  decide:
    name: Decide run
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.decide.outputs.run }}
    permissions:
      pull-requests: read
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "push" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "event=${EVENT_NAME}: run"
            exit 0
          fi
          # head filter is owner:branch (same-repo PRs). Fail open on API errors
          # so a transient gh blip still runs push CI when there is no PR coverage.
          count="$(gh api \
            "repos/${REPO}/pulls?state=open&head=${OWNER}:${REF_NAME}" \
            --jq 'length' 2>/dev/null || true)"
          if [[ "${count}" =~ ^[0-9]+$ && "${count}" -gt 0 ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "push skipped: ${count} open PR(s) for ${OWNER}:${REF_NAME}"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            if [[ -z "${count}" || ! "${count}" =~ ^[0-9]+$ ]]; then
              echo "push runs: PR lookup failed or empty; fail-open"
            else
              echo "push runs: no open PR for ${OWNER}:${REF_NAME}"
            fi
          fi

  # Fast gate: fmt + lint + unit tests + build before expensive MySQL matrix.
  go-check:
    name: Build + lint + test
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: make fmt-check

      - name: golangci-lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scale unit tests
        working-directory: test/integration
        run: |
          python3 -m pip install -r harness/requirements.txt
          python3 -m pytest -q scale/

      # Offline checks of the ES verification helpers (no Docker, no cluster).
      - name: ES harness unit tests
        working-directory: test/integration
        run: python3 -m unittest harness.test_es_verify

      - name: Build go-cdc binary
        run: make build

  mysql-mysql-e2e:
    name: MySQL ${{ matrix.mysql }} (func + types + load${{ matrix.mysql == '8.0' && ' + kafka' || '' }})
    # No job-level if: intentionally cascade-skips when go-check is skipped
    # (decide.run=false). Do not add if: always() / !cancelled() here.
    needs: go-check
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Artifact delete needs actions:write; upload only on main/master/release-*.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql: "5.7"
            image: mysql:5.7.42
            tag: "57"
            peak_seconds: "60"
            peak_workers: "4"
          - mysql: "8.0"
            image: mysql:8.0.36
            tag: "80"
            peak_seconds: "60"
            peak_workers: "4"

    defaults:
      run:
        working-directory: test/integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mysql-client
          python3 -m pip install -r harness/requirements.txt

      - name: Start MySQL ${{ matrix.mysql }} (docker compose)
        env:
          MYSQL_IMAGE: ${{ matrix.image }}
          MYSQL_TAG: ${{ matrix.tag }}
          COMPOSE_PROJECT_NAME: gocdc-it-${{ matrix.tag }}
        run: bash scripts/mysql-up.sh

      - name: Determine load profile
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]] ||
             [[ "${{ github.ref }}" == "refs/heads/main" ]] ||
             [[ "${{ github.ref }}" == "refs/heads/master" ]] ||
             [[ "${{ github.ref }}" == refs/heads/release-* ]]; then
            echo "LOAD_PROFILE=full" >> "$GITHUB_ENV"
            echo "LOAD_ROWS_PER_TABLE=100000" >> "$GITHUB_ENV"
          else
            echo "LOAD_PROFILE=normal" >> "$GITHUB_ENV"
            echo "LOAD_ROWS_PER_TABLE=30000" >> "$GITHUB_ENV"
          fi

      - name: Run integration harness
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 13306
          MYSQL_IMAGE: ${{ matrix.image }}
          MYSQL_TAG: ${{ matrix.tag }}
          COMPOSE_PROJECT_NAME: gocdc-it-${{ matrix.tag }}
          LOAD_PEAK_SECONDS: ${{ matrix.peak_seconds }}
          LOAD_PEAK_WORKERS: ${{ matrix.peak_workers }}
          LOAD_LARGE_ROWS: "50"
          LOAD_LARGE_FIELD_BYTES: "2097152"
        run: bash scripts/run-e2e.sh

      # Kafka sink IT (TP-K01..K08): MySQL 8.0 matrix only; reuses the same compose project.
      # Load knobs inherit LOAD_* from GITHUB_ENV (same tier as mysql→mysql load) + peak matrix.
      - name: Start Kafka (docker compose)
        if: matrix.mysql == '8.0'
        env:
          MYSQL_TAG: ${{ matrix.tag }}
          COMPOSE_PROJECT_NAME: gocdc-it-${{ matrix.tag }}
          KAFKA_HOST_PORT: "19092"
        run: bash scripts/kafka-up.sh

      - name: Run Kafka sink harness
        if: matrix.mysql == '8.0'
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 13306
          MYSQL_TAG: ${{ matrix.tag }}
          COMPOSE_PROJECT_NAME: gocdc-it-${{ matrix.tag }}
          KAFKA_BROKERS: 127.0.0.1:19092
          KAFKA_HOST_PORT: "19092"
          LOAD_PEAK_SECONDS: ${{ matrix.peak_seconds }}
          LOAD_PEAK_WORKERS: ${{ matrix.peak_workers }}
          LOAD_LARGE_ROWS: "50"
          LOAD_LARGE_FIELD_BYTES: "2097152"
        run: bash scripts/run-kafka-e2e.sh

      - name: Prune prior IT report artifact
        if: >
          always() &&
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/master' ||
           startsWith(github.ref, 'refs/heads/release-'))
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_NAME: go-cdc-it-report-mysql-${{ matrix.mysql }}
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            --jq '.artifacts[] | select(.name == env.ARTIFACT_NAME and .expired == false) | .id')"
          for id in ${ids}; do
            echo "Deleting prior artifact id=${id} name=${ARTIFACT_NAME}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done

      - name: Upload test report
        if: >
          always() &&
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/master' ||
           startsWith(github.ref, 'refs/heads/release-'))
        uses: actions/upload-artifact@v4
        with:
          name: go-cdc-it-report-mysql-${{ matrix.mysql }}
          path: |
            docs/test/reports/mysql-mysql-*.md
            docs/test/reports/mysql-kafka.md
            test/integration/workdir/ckpts*/**/*.ckpt
            test/integration/workdir/*.log
          if-no-files-found: warn

      - name: Tear down
        if: always()
        env:
          MYSQL_IMAGE: ${{ matrix.image }}
          MYSQL_TAG: ${{ matrix.tag }}
          COMPOSE_PROJECT_NAME: gocdc-it-${{ matrix.tag }}
        run: bash scripts/mysql-down.sh

  # Elasticsearch 8 sink: all four layers on MySQL 8.0 + a throwaway single-node
  # ES8 (security off, 512m heap). Scale runs `normal`; `heavy` is opt-in locally
  # because it needs 10 source DBs, 50k rows/hotspot and a 45s 8-writer peak.
  elasticsearch-e2e:
    name: Elasticsearch 8 (integration + e2e + load + scale normal)
    # No job-level if: cascade-skips when go-check is skipped.
    needs: go-check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    env:
      COMPOSE_PROJECT_NAME: gocdc-es-80
      MYSQL_IMAGE: mysql:8.0.36
      MYSQL_TAG: "80"
      ES_IMAGE: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
      ES_HEAP: 512m
      ES_HOST_PORT: "19200"
      LOAD_PROFILE: normal
      LOAD_ROWS_PER_TABLE: "30000"
      LOAD_PEAK_SECONDS: "60"
      LOAD_PEAK_WORKERS: "4"

    defaults:
      run:
        working-directory: test/integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mysql-client
          python3 -m pip install -r harness/requirements.txt

      - name: Start MySQL 8.0 + Elasticsearch 8 (docker compose)
        run: |
          bash scripts/mysql-up.sh
          bash scripts/es-up.sh

      # Layer 1: Go sink/runner against the real cluster (build tag esintegration).
      - name: Elasticsearch integration (real cluster)
        run: bash scripts/run-es-integration.sh

      # Layer 2: MySQL binlog -> runner -> ES8, including checkpoint restart.
      - name: Elasticsearch e2e harness
        run: bash scripts/run-es-e2e.sh

      # Layer 3: sustained load + peak writers (LOAD_* above).
      - name: Elasticsearch load harness
        run: bash scripts/run-es-load.sh

      # Layer 4: scale `normal` (CI-sized). `heavy` is a local/opt-in stress run.
      - name: Elasticsearch scale harness (normal)
        run: bash scripts/run-es-scale.sh normal

      - name: Prune prior ES report artifact
        if: >
          always() &&
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/master' ||
           startsWith(github.ref, 'refs/heads/release-'))
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_NAME: go-cdc-it-report-elasticsearch
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            --jq '.artifacts[] | select(.name == env.ARTIFACT_NAME and .expired == false) | .id')"
          for id in ${ids}; do
            echo "Deleting prior artifact id=${id} name=${ARTIFACT_NAME}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done

      - name: Upload ES test reports
        if: >
          always() &&
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/master' ||
           startsWith(github.ref, 'refs/heads/release-'))
        uses: actions/upload-artifact@v4
        with:
          name: go-cdc-it-report-elasticsearch
          path: |
            docs/test/reports/mysql-elasticsearch*.md
            test/integration/workdir/ckpts-es*/**/*.ckpt
            test/integration/workdir/*.log
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: |
          bash scripts/es-down.sh
          bash scripts/mysql-down.sh

  # ES7 (security off, 512m heap): the Go-level v7 adapter suite plus the CDC e2e
  # harness with sink.version=7. The ES8 job above keeps its own cluster and its
  # load/scale layers, so neither run can mask the other. No ES7 load/scale.
  elasticsearch7-integration:
    name: Elasticsearch 7 (integration + e2e)
    # No job-level if: cascade-skips when go-check is skipped.
    needs: go-check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: gocdc-es7-80
      MYSQL_IMAGE: mysql:8.0.36
      MYSQL_TAG: "80"
      ES7_IMAGE: docker.elastic.co/elasticsearch/elasticsearch:7.17.24
      ES7_HEAP: 512m
      ES7_HOST_PORT: "19201"

    defaults:
      run:
        working-directory: test/integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # mysql-up.sh waits through wait-for-mysql.sh, which needs mysqladmin (its
      # pymysql fallback is only installed by run-es7-e2e.sh much later), so the
      # client tools must exist before the containers start.
      - name: Install client tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mysql-client
          python3 -m pip install -r harness/requirements.txt

      # Offline check of the e2e target guard (no containers, no cluster).
      - name: ES7 e2e guard unit tests
        run: python3 -m unittest harness.test_es_target

      # MySQL only: the ES7 job needs no Kafka and no ES8 node.
      - name: Start MySQL 8.0 + Elasticsearch 7 (docker compose)
        env:
          MYSQL_UP_SERVICES: mysql
        run: |
          bash scripts/mysql-up.sh
          bash scripts/es7-up.sh

      # Go sink against the real ES 7 node (build tag esintegration).
      - name: Elasticsearch 7 integration (real cluster)
        run: bash scripts/run-es7-integration.sh

      # MySQL binlog -> runner -> ES7, sink.version=7 (same harness as ES8).
      - name: Elasticsearch 7 e2e harness
        run: bash scripts/run-es7-e2e.sh

      - name: Tear down
        if: always()
        run: |
          bash scripts/es7-down.sh
          bash scripts/mysql-down.sh

  mysql-scale-e2e:
    name: MySQL ${{ matrix.mysql }} scale
    # No job-level if: intentionally cascade-skips when go-check is skipped
    # (decide.run=false). Do not add if: always() / !cancelled() here.
    needs: go-check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql: "8.0"
            image: mysql:8.0.36
            tag: "80"

    defaults:
      run:
        working-directory: test/integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mysql-client
          python3 -m pip install -r harness/requirements.txt

      - name: Start MySQL ${{ matrix.mysql }} (docker compose)
        env:
          MYSQL_IMAGE: ${{ matrix.image }}
          MYSQL_TAG: ${{ matrix.tag }}
          # Isolate from mysql-mysql-e2e (default host port 13306).
          MYSQL_HOST_PORT: "13307"
          MYSQL_PORT: "13307"
          COMPOSE_PROJECT_NAME: gocdc-scale-${{ matrix.tag }}
        run: bash scripts/mysql-up.sh

      - name: Determine scale profile
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "SCALE_PROFILE=${{ inputs.scale_profile }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.event_name }}" == "pull_request" ]] ||
               [[ "${{ github.ref }}" == "refs/heads/main" ]] ||
               [[ "${{ github.ref }}" == "refs/heads/master" ]] ||
               [[ "${{ github.ref }}" == refs/heads/release-* ]]; then
            echo "SCALE_PROFILE=heavy" >> "$GITHUB_ENV"
          else
            echo "SCALE_PROFILE=normal" >> "$GITHUB_ENV"
          fi

      - name: Run scale harness
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "13307"
          MYSQL_HOST_PORT: "13307"
          MYSQL_IMAGE: ${{ matrix.image }}
          MYSQL_TAG: ${{ matrix.tag }}
          COMPOSE_PROJECT_NAME: gocdc-scale-${{ matrix.tag }}
        run: bash scale/run-scale.sh

      - name: Prune prior scale report artifact
        if: >
          always() &&
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/master' ||
           startsWith(github.ref, 'refs/heads/release-'))
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_NAME: go-cdc-scale-report-mysql-${{ matrix.mysql }}
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            --jq '.artifacts[] | select(.name == env.ARTIFACT_NAME and .expired == false) | .id')"
          for id in ${ids}; do
            echo "Deleting prior artifact id=${id} name=${ARTIFACT_NAME}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done

      - name: Upload scale test report
        if: >
          always() &&
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/master' ||
           startsWith(github.ref, 'refs/heads/release-'))
        uses: actions/upload-artifact@v4
        with:
          name: go-cdc-scale-report-mysql-${{ matrix.mysql }}
          path: |
            docs/test/reports/mysql-mysql-scale-*.md
            test/integration/workdir/*.log
          if-no-files-found: warn

      - name: Tear down
        if: always()
        env:
          MYSQL_IMAGE: ${{ matrix.image }}
          MYSQL_TAG: ${{ matrix.tag }}
          MYSQL_HOST_PORT: "13307"
          MYSQL_PORT: "13307"
          COMPOSE_PROJECT_NAME: gocdc-scale-${{ matrix.tag }}
        run: bash scripts/mysql-down.sh
