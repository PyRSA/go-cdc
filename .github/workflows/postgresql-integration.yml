# PostgreSQL sink CI, layered (spec section 10):
#
#   pull_request / push        decide + postgres-sink-dml + postgresql-offline
#                              + postgresql-e2e. Cheap: one pinned server per
#                              job, no load, no scale, no benchmark.
#   workflow_dispatch          the same, plus whichever of load / scale / compat /
#                              benchmark the caller explicitly ticks. Every heavy
#                              job defaults to off and `heavy` scale needs an
#                              explicit choice from the `scale_profile` list.
#   schedule (weekly, Monday)  decide + postgres-sink-dml + postgresql-compat:
#                              the PostgreSQL 14-18 matrix (PG-209), which a
#                              single-version PR run can never reveal.
#
# Isolation: every harness job owns one compose project and one workspace, so no
# container, volume, checkpoint directory or report file is shared between jobs.
# Exit-code vocabulary: 0 = PASS, 2 = ENV BLOCKED, anything else = FAIL. Each
# harness step exits with the status the harness returned, so an unusable
# environment can never be reported as a green run.
name: CI / PostgreSQL Sink Integration

on:
  # The sink under test is reached through common/event, runtime/route and
  # composer, so any Go change can break it; docs-only changes are excluded,
  # except this workflow itself. test/integration/** carries the harnesses, the
  # IT entry scripts and the reports the jobs below produce.
  push:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "test/integration/**"
      - ".github/workflows/postgresql-integration.yml"
      - "!**/*.md"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "test/integration/**"
      - ".github/workflows/postgresql-integration.yml"
      - "!**/*.md"
  # Weekly version matrix. Nothing else is scheduled: a major-version regression
  # is the one thing a run pinned to a single server cannot show.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      run_compat:
        description: "PostgreSQL 14-18 compatibility matrix (E2E suite x 5 versions)"
        type: boolean
        default: false
      run_load:
        description: "E2E load suite (TP-PL01..TP-PL04)"
        type: boolean
        default: false
      run_benchmark:
        description: "Sink benchmark (PG-210: 2 workloads x batch 100/1000/5000)"
        type: boolean
        default: false
      scale_profile:
        description: "E2E scale profile (heavy is ~300k rows; never a default)"
        type: choice
        options: [none, normal, heavy]
        default: none

# Per-workflow group: a newer commit on the same branch/PR cancels older runs
# of THIS workflow only. Same commit's repo-checks / integration runs are untouched.
concurrency:
  group: postgresql-sink-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Same-repo PR + push would double-run; skip push work when an open PR
  # already covers this head (pull_request / workflow_dispatch always run).
  decide:
    name: Decide run
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.decide.outputs.run }}
    permissions:
      pull-requests: read
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "push" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "event=${EVENT_NAME}: run"
            exit 0
          fi
          # Fail open on API errors so a transient gh blip still runs push CI.
          count="$(gh api \
            "repos/${REPO}/pulls?state=open&head=${OWNER}:${REF_NAME}" \
            --jq 'length' 2>/dev/null || true)"
          if [[ "${count}" =~ ^[0-9]+$ && "${count}" -gt 0 ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "push skipped: ${count} open PR(s) for ${OWNER}:${REF_NAME}"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            if [[ -z "${count}" || ! "${count}" =~ ^[0-9]+$ ]]; then
              echo "push runs: PR lookup failed or empty; fail-open"
            else
              echo "push runs: no open PR for ${OWNER}:${REF_NAME}"
            fi
          fi

  postgres-sink-dml:
    name: PostgreSQL 16 sink DML
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The patch tag is pinned like the MySQL images in integration.yml, so a
    # server upgrade is a deliberate change rather than a silent one.
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: cdc
          POSTGRES_PASSWORD: cdc_it_password
          POSTGRES_DB: cdc_it
        ports:
          - 5432:5432
        # The runner blocks on this health check, so no step starts against a
        # booting server; pg_isready proves the listener accepts connections.
        options: >-
          --health-cmd "pg_isready -U cdc -d cdc_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: cdc
      PGDATABASE: cdc_it
      PGPASSWORD: cdc_it_password
      # Read by connector/sink/postgresql/sink_integration_test.go only.
      PG_DSN: postgres://cdc:cdc_it_password@127.0.0.1:5432/cdc_it?sslmode=disable
      # Turns a missing DSN into a failure instead of a suite-wide skip.
      PG_IT_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify PostgreSQL accepts connections
        run: |
          set -euo pipefail
          if [[ -z "${PG_DSN:-}" ]]; then
            echo "::error::PG_DSN is empty; the integration environment is broken."
            exit 1
          fi
          # Print the target without the password so a connection failure is
          # diagnosable from the log alone.
          echo "target: postgres://${PGUSER}@${PGHOST}:${PGPORT}/${PGDATABASE} (password hidden)"
          if ! command -v psql >/dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          # pg_isready gates container start-up; it does not prove the
          # authentication path works, so probe with the real credentials. Only
          # this probe retries: a failing Go test is never retried, otherwise a
          # real defect could be hidden behind a green job.
          attempts=5
          for attempt in $(seq 1 "${attempts}"); do
            if psql --no-password --set=ON_ERROR_STOP=1 \
              --command 'SELECT version()' \
              --command 'SELECT current_user, current_database()'; then
              echo "auth probe passed on attempt ${attempt}/${attempts}"
              exit 0
            fi
            if [[ "${attempt}" -eq "${attempts}" ]]; then
              echo "::error::psql auth probe failed ${attempts} times; the server never accepted the credentials."
              exit 1
            fi
            echo "auth probe attempt ${attempt}/${attempts} failed; retrying in 2s"
            sleep 2
          done

      - name: Run PostgreSQL integration tests
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/postgres-sink-it.log"
          # The exit code is captured instead of letting set -e abort the step, so
          # the failing cases can be reprinted before the step ends. The captured
          # status is what the step exits with, so a red run stays red; tee still
          # writes the untouched log to the console, so the full output survives.
          set +e
          # pipefail makes the pipeline report the go test status, not tee's.
          go test -tags postgres_integration ./connector/sink/postgresql/ \
            -count=1 -v -timeout 10m 2>&1 | tee "${log}"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            # Go prints a case as a block that opens with "=== RUN" and holds the
            # assertion lines, the indented "--- FAIL" line and, on a crash, the
            # panic dump. The block is buffered and replayed once any failure
            # marker was seen inside it, so the assertion line that precedes
            # "--- FAIL" is kept instead of dropped. No count of lines is assumed,
            # so a multi-line PostgreSQL error or a panic stack stays whole.
            failures="$(awk '
              function flush() { if (flag) printf "%s", buf; buf = ""; flag = 0 }
              /^(=== RUN|=== PAUSE|=== CONT)/ { flush(); buf = $0 "\n"; next }
              { buf = buf $0 "\n" }
              /^[[:space:]]*--- (FAIL|SKIP):/ { flag = 1 }
              /^(panic:|fatal error:)/ { flag = 1 }
              END { flush() }
            ' "${log}")"
            if [[ -z "${failures}" ]]; then
              # A build failure or a crash before the first case prints no block at
              # all, so the whole log is the only evidence: it is reprinted whole
              # rather than truncated, because truncation is what hid the message.
              failures="$(cat "${log}")"
            fi
            fail_count="$(awk '/^[[:space:]]*--- FAIL:/{n++} END{print n+0}' "${log}")"
            # Go indents an assertion as "file.go:line: message". The token may not
            # carry a slash, so a stack frame such as /usr/local/go/src/.../x.go is
            # not mistaken for an assertion site.
            sites="$(awk '
              match($0, /[[:space:]][^[:space:]\/]+\.go:[0-9]+:/) {
                site = substr($0, RSTART + 1, RLENGTH - 1)
                if (!(site in seen)) { seen[site] = 1; printf "%s%s", sep, site; sep = ", " }
              }
            ' "${log}")"
            if (( fail_count > 0 )); then
              summary="${fail_count} failing case(s); assertion sites: ${sites:-none}."
            else
              # A build error, a crash or a timeout reports no --- FAIL line.
              summary="the run failed before any case printed '--- FAIL'; see the log reprinted below."
            fi
            echo "::group::failing PostgreSQL integration tests"
            printf '%s\n' "${failures}"
            echo "::endgroup::"
            # One annotation for the whole run. GitHub caps a step at ten of them,
            # so a per-line loop would drop the tail exactly when many cases fail.
            echo "::error::${summary} Failing blocks are in the group above and the raw log was printed by tee."
            exit "${status}"
          fi
          # A skip means no server was contacted, so a green run that skipped
          # must not be read as a passing DML path.
          if grep -q '^--- SKIP' "${log}"; then
            echo "::error::the integration suite skipped at least one test; it must hit a real PostgreSQL."
            grep '^--- SKIP' "${log}"
            exit 1
          fi
          # Every test in the integration file must report PASS, so a case that
          # stops running cannot quietly turn the job green.
          missing=0
          while read -r name; do
            if ! grep -q "^--- PASS: ${name} " "${log}"; then
              echo "::error::integration test ${name} did not report PASS."
              missing=$((missing + 1))
            fi
          done < <(sed -n 's/^func \(Test[A-Za-z0-9_]*\)(.*/\1/p' \
            connector/sink/postgresql/sink_integration_test.go)
          if (( missing > 0 )); then
            exit 1
          fi
          echo "OK: every test in sink_integration_test.go passed against PostgreSQL."

      # Distinguishes a broken server from a failing assertion after the fact.
      - name: Dump PostgreSQL logs on failure
        if: failure()
        run: |
          set -uo pipefail
          for id in $(docker ps -aq --filter ancestor=postgres:16.4); do
            echo "=== docker logs ${id} (tail 200) ==="
            docker logs --tail 200 "${id}" 2>&1
          done

  # Offline gate for the PostgreSQL harnesses: no container, no server. It pins
  # the parts that decide whether a reported number or status may be believed
  # (benchmark matrix/metrics/report honesty, compatibility-matrix statuses,
  # load verification, checkpoint/row-count helpers). Cheap enough for a PR.
  postgresql-offline:
    name: PostgreSQL harness offline checks
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: test/integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install harness deps
        run: python3 -m pip install -r harness/requirements.txt

      - name: Harness unit tests
        run: |
          set -euo pipefail
          # unittest (not pytest): the modules are written against it and must run
          # without the scale/ conftest. A failure here blocks the harness jobs.
          python3 -m unittest \
            harness.test_pg_bench \
            harness.test_pg_compat \
            harness.test_pg_load \
            harness.test_pg_verify

      - name: Benchmark renders a NOT RUN report without a database
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/pg-bench-dry-run.md"
          python3 -m harness.pg_bench_it --dry-run --report "${report}"
          # A dry run must not claim a measured result. The report's own header
          # carries the literal "rows/s" and its legend the word "PASS", so the
          # check looks at the per-cell status column and at the summary line
          # instead of grepping for those words.
          if ! grep -q 'pass 0 / fail 0 / not run 6 of 6' "${report}"; then
            echo "::error::the dry-run benchmark report does not declare six NOT RUN cells"
            exit 1
          fi
          if [ "$(grep -cE '^\| (insert|mixed) \|' "${report}")" -ne 6 ]; then
            echo "::error::the dry-run benchmark report lost matrix rows"
            exit 1
          fi
          if grep -E '^\| (insert|mixed) \|' "${report}" | grep -qv 'NOT RUN'; then
            echo "::error::the dry-run benchmark report claims a cell that was not measured"
            exit 1
          fi
          echo "::notice::dry run wrote ${report} with every cell NOT RUN"

      - name: Compatibility matrix plan (14-18)
        run: |
          set -euo pipefail
          # --list prints the five rows and exits; it proves the matrix still maps
          # each major version to an image, a report and an expected-major guard.
          out="$(python3 -m harness.pg_compat --list)"
          printf '%s\n' "${out}"
          for version in 14 15 16 17 18; do
            if ! grep -q "^PG${version}: image=postgres:${version} " <<<"${out}"; then
              echo "::error::compatibility matrix row for PostgreSQL ${version} is missing"
              exit 1
            fi
          done

  # The only harness job a pull request runs: TP-P01..TP-P20 against one pinned
  # server. It answers "is the sink correct", not "how fast is it" - the load,
  # scale and benchmark jobs own the numbers.
  postgresql-e2e:
    name: PostgreSQL E2E (TP-P01..TP-P20)
    needs: decide
    if: needs.decide.outputs.run == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # One compose project per job: no container, volume, network, checkpoint
      # directory or report file is shared with another job.
      COMPOSE_PROJECT_NAME: gocdc-pg-e2e
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "13306"
      PG_HOST: 127.0.0.1
      PG_PORT: "15432"
      PG_IMAGE: postgres:16.4
      # The suite refuses to seed a server of another major version, so a stale
      # container can never be reported as this job's result.
      PG_EXPECT_MAJOR: "16"
    defaults:
      run:
        working-directory: test/integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mysql-client postgresql-client
          python3 -m pip install -r harness/requirements.txt

      # MySQL only: the postgres service is started next with a pinned image, so
      # this step must not pull/start kafka or elasticsearch from the same file.
      - name: Start MySQL (docker compose)
        env:
          MYSQL_UP_SERVICES: mysql
        run: bash scripts/mysql-up.sh

      - name: Start PostgreSQL (docker compose)
        run: bash scripts/pg-up.sh

      - name: Run PostgreSQL E2E harness
        run: |
          set +e
          bash scripts/run-pg-e2e.sh
          status=$?
          set -e
          case "${status}" in
            0) echo "::notice::PASS: every test point reported a passing result." ;;
            2) echo "::error::ENV BLOCKED (exit 2): the harness could not use this environment, so nothing was verified. This is NOT a pass." ;;
            *) echo "::error::FAIL (exit ${status}): see the report and the logs in this run's artifact." ;;
          esac
          exit "${status}"

      # go-cdc echoes its configuration when it fails; a sink password must not
      # survive in a log that is about to be printed and archived.
      - name: Redact credentials from logs
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          find test/integration/workdir -maxdepth 2 -name '*.log' -print0 2>/dev/null \
            | xargs -0 --no-run-if-empty sed -i -E 's/(password[=: ]+)[^ ,"]+/\1***/Ig' || true

      - name: Failure evidence
        if: failure()
        run: |
          set -uo pipefail
          for f in workdir/*.log; do
            [[ -f "${f}" ]] || continue
            echo "::group::tail -60 ${f}"
            tail -60 "${f}"
            echo "::endgroup::"
          done
          docker compose logs --tail=60 postgres 2>&1 || true
          docker compose logs --tail=40 mysql 2>&1 || true

      - name: Upload PostgreSQL E2E report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-e2e-report
          path: |
            docs/test/reports/mysql-postgresql-func*.md
            test/integration/workdir/*.log
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Tear down
        if: always()
        run: |
          bash scripts/pg-down.sh || true
          bash scripts/mysql-down.sh || true

  # E2E load (TP-PL01..TP-PL04): snapshot volume, peak write, catch-up and
  # reconciliation. Dispatch-only - it seeds 50k rows per table and holds a
  # 60 s four-writer peak, which is not PR work.
  postgresql-load:
    name: PostgreSQL E2E load (TP-PL01..TP-PL04)
    needs: decide
    if: github.event_name == 'workflow_dispatch' && inputs.run_load
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: gocdc-pg-load
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "13306"
      PG_HOST: 127.0.0.1
      PG_PORT: "15432"
      PG_IMAGE: postgres:16.4
    defaults:
      run:
        working-directory: test/integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mysql-client postgresql-client
          python3 -m pip install -r harness/requirements.txt

      - name: Start MySQL (docker compose)
        env:
          MYSQL_UP_SERVICES: mysql
        run: bash scripts/mysql-up.sh

      - name: Start PostgreSQL (docker compose)
        run: bash scripts/pg-up.sh

      - name: Run PostgreSQL load harness
        run: |
          set +e
          bash scripts/run-pg-load.sh
          status=$?
          set -e
          case "${status}" in
            0) echo "::notice::PASS: the load suite reported every test point as passing." ;;
            2) echo "::error::ENV BLOCKED (exit 2): the load suite could not use this environment. This is NOT a pass." ;;
            *) echo "::error::FAIL (exit ${status}): see the load report and the logs." ;;
          esac
          exit "${status}"

      - name: Redact credentials from logs
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          find test/integration/workdir -maxdepth 2 -name '*.log' -print0 2>/dev/null \
            | xargs -0 --no-run-if-empty sed -i -E 's/(password[=: ]+)[^ ,"]+/\1***/Ig' || true

      - name: Failure evidence
        if: failure()
        run: |
          set -uo pipefail
          for f in workdir/*.log; do
            [[ -f "${f}" ]] || continue
            echo "::group::tail -60 ${f}"
            tail -60 "${f}"
            echo "::endgroup::"
          done
          docker compose logs --tail=60 postgres 2>&1 || true

      - name: Upload PostgreSQL load report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-load-report
          path: |
            docs/test/reports/mysql-postgresql-load.md
            test/integration/workdir/*.log
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Tear down
        if: always()
        run: |
          bash scripts/pg-down.sh || true
          bash scripts/mysql-down.sh || true

  # E2E scale: 20 tables / 50k rows per table (`normal`) or 50 tables / 300k rows
  # (`heavy`). Dispatch-only, and `heavy` only when the caller picks it from the
  # `scale_profile` list - run-pg-scale.sh itself also refuses `heavy` unless
  # PG_SCALE_HEAVY=1, so the two gates agree.
  postgresql-scale:
    name: PostgreSQL E2E scale (${{ inputs.scale_profile }})
    needs: decide
    if: github.event_name == 'workflow_dispatch' && inputs.scale_profile != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: gocdc-pg-scale
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "13306"
      PG_HOST: 127.0.0.1
      PG_PORT: "15432"
      PG_IMAGE: postgres:16.4
      # Mirrors the dispatch choice into the second, in-script gate.
      PG_SCALE_HEAVY: ${{ inputs.scale_profile == 'heavy' && '1' || '0' }}
    defaults:
      run:
        working-directory: test/integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mysql-client postgresql-client
          python3 -m pip install -r harness/requirements.txt

      - name: Start MySQL (docker compose)
        env:
          MYSQL_UP_SERVICES: mysql
        run: bash scripts/mysql-up.sh

      - name: Start PostgreSQL (docker compose)
        run: bash scripts/pg-up.sh

      - name: Run PostgreSQL scale harness
        run: |
          set +e
          bash scripts/run-pg-scale.sh "${{ inputs.scale_profile }}"
          status=$?
          set -e
          case "${status}" in
            0) echo "::notice::PASS: the ${{ inputs.scale_profile }} profile reported every test point as passing." ;;
            2) echo "::error::ENV BLOCKED (exit 2): the scale suite could not use this environment. This is NOT a pass." ;;
            *) echo "::error::FAIL (exit ${status}): see the scale report and the logs." ;;
          esac
          exit "${status}"

      - name: Redact credentials from logs
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          find test/integration/workdir -maxdepth 2 -name '*.log' -print0 2>/dev/null \
            | xargs -0 --no-run-if-empty sed -i -E 's/(password[=: ]+)[^ ,"]+/\1***/Ig' || true

      - name: Failure evidence
        if: failure()
        run: |
          set -uo pipefail
          for f in workdir/*.log; do
            [[ -f "${f}" ]] || continue
            echo "::group::tail -60 ${f}"
            tail -60 "${f}"
            echo "::endgroup::"
          done
          docker compose logs --tail=60 postgres 2>&1 || true

      - name: Upload PostgreSQL scale report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-scale-report-${{ inputs.scale_profile }}
          path: |
            docs/test/reports/mysql-postgresql-scale-*.md
            test/integration/workdir/*.log
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Tear down
        if: always()
        run: |
          bash scripts/pg-down.sh || true
          bash scripts/mysql-down.sh || true

  # PostgreSQL 14-18 matrix (PG-209), weekly and on demand. One job, one compose
  # project: harness.pg_compat switches the `postgres` service image per version
  # and writes one report that can only say COMPLETE when all five rows really
  # ran. Splitting it across runners would leave five partial reports instead of
  # one honest matrix, so the versions run in sequence here.
  postgresql-compat:
    name: PostgreSQL 14-18 compatibility matrix
    needs: decide
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_compat)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: gocdc-pg-compat
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "13306"
      PG_HOST: 127.0.0.1
      PG_PORT: "15432"
      # No PG_IMAGE/PG_EXPECT_MAJOR here on purpose: harness.pg_compat pins both
      # per version (via scripts/pg-up.sh) and records them in the matrix report.
    defaults:
      run:
        working-directory: test/integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mysql-client postgresql-client
          python3 -m pip install -r harness/requirements.txt

      # MySQL only: the matrix owns the postgres service and recreates it per
      # version (`docker compose rm -sfv postgres`), so it must not be started
      # here with an arbitrary default image.
      - name: Start MySQL (docker compose)
        env:
          MYSQL_UP_SERVICES: mysql
        run: bash scripts/mysql-up.sh

      - name: Run PostgreSQL 14-18 matrix
        run: |
          set +e
          bash scripts/run-pg-compat.sh
          status=$?
          set -e
          case "${status}" in
            0) echo "::notice::PASS: all five majors ran and passed (PG-209 complete)." ;;
            2) echo "::error::ENV BLOCKED (exit 2): at least one version could not run here (no image / no server). The matrix report says which; this is NOT a pass." ;;
            *) echo "::error::FAIL (exit ${status}): at least one version ran and failed. See the matrix report." ;;
          esac
          exit "${status}"

      - name: Redact credentials from logs
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          find test/integration/workdir -maxdepth 2 -name '*.log' -print0 2>/dev/null \
            | xargs -0 --no-run-if-empty sed -i -E 's/(password[=: ]+)[^ ,"]+/\1***/Ig' || true

      - name: Failure evidence
        if: failure()
        run: |
          set -uo pipefail
          for f in workdir/pg-compat-*.log; do
            [[ -f "${f}" ]] || continue
            echo "::group::tail -60 ${f}"
            tail -60 "${f}"
            echo "::endgroup::"
          done
          docker compose ps 2>&1 || true
          docker compose logs --tail=60 postgres 2>&1 || true

      - name: Upload compatibility matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-compat-report
          path: |
            docs/test/reports/mysql-postgresql-compat.md
            docs/test/reports/mysql-postgresql-func-pg*.md
            test/integration/workdir/pg-compat-*.log
            test/integration/workdir/*.log
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Tear down
        if: always()
        run: |
          bash scripts/pg-down.sh || true
          bash scripts/mysql-down.sh || true

  # Sink benchmark (PG-210, plan T3.21..T3.24): a performance report, not an
  # acceptance test. Dispatch-only because a full run writes 2 x 3 x 20k rows and
  # the numbers are only comparable on a quiet, fixed machine.
  postgresql-benchmark:
    name: PostgreSQL sink benchmark (PG-210)
    needs: decide
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: gocdc-pg-bench
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "13306"
      PG_HOST: 127.0.0.1
      PG_PORT: "15432"
      PG_IMAGE: postgres:16.4
      ROOT_USER: root
      ROOT_PASSWORD: rootpass
    defaults:
      run:
        working-directory: test/integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mysql-client postgresql-client
          python3 -m pip install -r harness/requirements.txt

      # The benchmark reads host CPU/RSS from /proc; nothing extra is installed
      # for it, and a non-Linux host would render those columns as `-`.
      - name: Start MySQL (docker compose)
        env:
          MYSQL_UP_SERVICES: mysql
        run: bash scripts/mysql-up.sh

      - name: Start PostgreSQL (docker compose)
        run: bash scripts/pg-up.sh

      - name: Run PostgreSQL sink benchmark
        run: |
          set +e
          bash scripts/run-pg-bench.sh
          status=$?
          set -e
          case "${status}" in
            0) echo "::notice::PASS: every cell ran and reconciled; the report holds the measured numbers." ;;
            2) echo "::error::ENV BLOCKED (exit 2): the benchmark could not use this environment. This is NOT a pass." ;;
            *) echo "::error::FAIL (exit ${status}): a cell failed; see the benchmark report." ;;
          esac
          exit "${status}"

      - name: Redact credentials from logs
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          find test/integration/workdir -maxdepth 2 -name '*.log' -print0 2>/dev/null \
            | xargs -0 --no-run-if-empty sed -i -E 's/(password[=: ]+)[^ ,"]+/\1***/Ig' || true

      - name: Failure evidence
        if: failure()
        run: |
          set -uo pipefail
          for f in workdir/*.log; do
            [[ -f "${f}" ]] || continue
            echo "::group::tail -60 ${f}"
            tail -60 "${f}"
            echo "::endgroup::"
          done
          docker compose logs --tail=60 postgres 2>&1 || true

      - name: Upload benchmark report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-benchmark-report
          path: |
            docs/test/reports/mysql-postgresql-benchmark*.md
            test/integration/workdir/*.log
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Tear down
        if: always()
        run: |
          bash scripts/pg-down.sh || true
          bash scripts/mysql-down.sh || true
