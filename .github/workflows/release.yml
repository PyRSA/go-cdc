# Formal releases: push tag release-vX.Y.Z (e.g. release-v0.1.0) →
# build Linux binaries → GitHub Release assets.
# Nightly / edge rolling builds are out of scope for this workflow.
name: CI / Release

on:
  push:
    tags:
      - "release-v[0-9]+.[0-9]+.[0-9]+"

# Re-pushing the same tag cancels an in-flight release for that tag only.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          targets=(
            linux/amd64
            linux/arm64
          )
          for pair in "${targets[@]}"; do
            goos="${pair%/*}"
            goarch="${pair#*/}"
            out="dist/go-cdc_${VERSION}_${goos}_${goarch}"
            echo "==> ${out}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags="-s -w" -o "${out}" ./cmd/go-cdc
            sha256sum "${out}" | awk '{print $1"  "+$2}' > "${out}.sha256"
          done
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/go-cdc_*
          fail_on_unmatched_files: true
